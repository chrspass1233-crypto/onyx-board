<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Onyx HQ</title>
<style>
:root{--bg:#0b0f14;--card:#131a23;--line:#1f2a37;--tx:#e6edf3;--dim:#8b98a5;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--card)}
h1{font-size:16px;letter-spacing:.02em;white-space:nowrap}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
#tabs button{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-family:inherit}
#tabs button.on{background:var(--blue);border-color:var(--blue);color:#04121f;font-weight:700}
.who{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.badge{font-size:10px;letter-spacing:.06em;border:1px solid var(--green);color:var(--green);border-radius:4px;padding:1px 6px}
#panes{flex:1;position:relative;overflow:auto}
iframe.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#team{display:none;padding:20px;max-width:1100px;margin:0 auto}
#load{padding:40px;text-align:center;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:12px}
.sub{color:var(--dim);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
.form label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.form .full{grid-column:1/-1}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;width:100%}
.btn{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#04121f;font-weight:700}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-size:11px;text-transform:uppercase;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:10px;font-size:13px;color:var(--dim)}
.chk input{width:auto}
.signin{max-width:440px;margin:40px auto;text-align:left}
.signin .code{font-size:22px;letter-spacing:6px;text-align:center;max-width:200px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101822;border:1px solid var(--line);color:var(--tx);padding:9px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
.foot{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.6}
</style></head><body>
<header><h1>SOCIAL ONYX HQ</h1><nav id="tabs"></nav><span class="who" id="who"></span></header>
<div id="panes"><div id="load">Loading...</div><div id="team"></div></div>
<div class="toast" id="toast"></div>
<script>
/* Social Onyx HQ (2026-09-14). One team list, one sign-in, shared with the SOP Library: a member signs in once
   (6-digit code texted through GHL) and the same 90-day session works here and there. Tabs are filtered ON THE
   SERVER by role: this page is only ever handed the boards the person may see. Member and role management is the
   SOP Library API; this page just embeds the same Team panel and talks to both functions with the same token. */
var HQ='https://rtbatvkghjnuwmgienqv.supabase.co/functions/v1/socialonyx-hq';
var SOP='https://rtbatvkghjnuwmgienqv.supabase.co/functions/v1/sop-library';
var HQ_TABS=['Team Board','PnL','Sales Mgmt','Creators & Ads','CSM Daily','Agreements','Commissions'];   // the Questions tab is artifact-only (its answers self-save there), so it is not a served tab
var Q=new URLSearchParams(location.search);
var LEGACY=Q.get('t')||'';
function getSession(){try{return localStorage.getItem('sop_session')||''}catch(e){return ''}}
function setSession(s){try{if(s)localStorage.setItem('sop_session',s);else localStorage.removeItem('sop_session');}catch(e){}}
var T=LEGACY||getSession();
var D=null, frames={}, current=null, TEAM=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function val(id){var x=document.getElementById(id);return x?x.value.trim():'';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},2600);}
function b64utf8(s){return new TextDecoder().decode(Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)}));}
function sopPost(body){return fetch(SOP+'?t='+encodeURIComponent(T),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()});}
function sopOpen(body){return fetch(SOP,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()});}
function hqPost(body){return fetch(HQ+'?t='+encodeURIComponent(T),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()});}

/* ---------- sign-in: same flow as the SOP Library, same codes, same session ---------- */
function signin(msg,email){
  D=null;document.getElementById('who').innerHTML='';document.getElementById('tabs').innerHTML='';document.getElementById('team').style.display='none';
  Object.keys(frames).forEach(function(k){frames[k].remove();});frames={};
  var l=document.getElementById('load');l.style.display='block';
  l.innerHTML='<div class="card signin"><h3>Sign in</h3><div class="sub">Use the email you were invited with. A 6-digit code is texted to the phone on file (an email copy goes out too). It is the same sign-in as the SOP Library.</div>'+(msg?'<div class="sub" style="color:var(--amber);margin-top:8px">'+esc(msg)+'</div>':'')+
    '<div class="row" style="margin-top:14px"><input type="text" id="si-email" placeholder="you@company.com" value="'+esc(email||'')+'" autocomplete="email" inputmode="email"><button class="btn primary" id="si-send">Send me a code</button></div>'+
    '<div class="row" id="si-code-row" style="display:none"><input type="text" id="si-code" class="code" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn primary" id="si-go">Sign in</button></div><div class="sub" id="si-out" style="margin-top:8px"></div></div>';
  var out=document.getElementById('si-out');
  function send(){var em=val('si-email');if(!em){out.textContent='Enter your email.';return;}out.textContent='Sending...';sopOpen({action:'login_request',email:em}).then(function(j){if(!j.ok){out.textContent=j.error;return;}document.getElementById('si-code-row').style.display='flex';out.textContent=(j.sms?'Code texted to the number ending '+j.phone_hint+(j.email?' (and emailed to '+em+')':''):'Code emailed to '+em+', check spam the first time')+'. Enter it here.';document.getElementById('si-code').focus();}).catch(function(e){out.textContent='Could not reach the HQ: '+e;});}
  function go(){var em=val('si-email'),c=val('si-code');if(c.length!==6){out.textContent='Enter the 6-digit code.';return;}out.textContent='Checking...';verify(em,c,out);}
  document.getElementById('si-send').onclick=send;document.getElementById('si-go').onclick=go;
  document.getElementById('si-email').onkeydown=function(e){if(e.key==='Enter')send();};
  document.getElementById('si-code').onkeydown=function(e){if(e.key==='Enter')go();};
  document.getElementById(email?'si-send':'si-email').focus();
}
function verify(em,c,out){
  return sopOpen({action:'login_verify',email:em,code:c}).then(function(j){if(!j.ok){if(out)out.textContent=j.error;else signin(j.error,em);return;}setSession(j.session);T=j.session;if(Q.get('c'))history.replaceState({},'',location.pathname);load();}).catch(function(e){if(out)out.textContent='Could not reach the HQ: '+e;});
}

/* ---------- load: the server decides which tabs come back ---------- */
function load(){
  if(!T){signin();return Promise.resolve();}
  var l=document.getElementById('load');l.textContent='Loading your dashboards...';l.style.display='block';
  return fetch(HQ+'?t='+encodeURIComponent(T),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){
      if(LEGACY&&T===LEGACY){l.textContent='This link is not active. Open the HQ without a link and sign in with your email, or ask Chris.';return;}
      setSession('');T='';signin(/expired|inactive|sign in/.test(j.error||'')?'Your sign-in has expired. Enter your email for a new code.':('Could not load: '+(j.error||'unknown')));return;
    }
    D=j;
    document.getElementById('who').innerHTML=esc(j.member.name)+' · '+esc(j.member.role_name)+(j.member.is_ceo?'<span class="badge">CEO</span>':(j.member.is_admin?'<span class="badge">ADMIN</span>':''))+(j.member.via_session?' <button class="btn sm" id="signout">Sign out</button>':'');
    var so=document.getElementById('signout');if(so)so.onclick=function(){hqPost({action:'logout'}).then(function(){setSession('');T='';signin('Signed out.');});};
    l.style.display='none';
    nav();
    var start=(j.tabs[0]||{}).name||(j.member.is_admin?'Team':null);
    try{var saved=localStorage.getItem('onyx_hq_tab');if(saved&&(j.tabs.some(function(t){return t.name===saved})||(saved==='Team'&&j.member.is_admin)))start=saved;}catch(e){}
    if(start)activate(start);else l.style.display='block',l.textContent='Your role has no dashboards yet. Ask Chris to tick some for you in the Team panel.';
  }).catch(function(e){l.textContent='Could not reach the HQ: '+e;});
}
function nav(){
  var bar=document.getElementById('tabs');bar.innerHTML='';
  D.tabs.forEach(function(t){var b=document.createElement('button');b.textContent=t.name;b.dataset.tab=t.name;b.onclick=function(){activate(t.name)};bar.appendChild(b);});
  if(D.member.is_admin){var b=document.createElement('button');b.textContent='Team';b.dataset.tab='Team';b.onclick=function(){activate('Team')};bar.appendChild(b);}
}
function activate(name){
  current=name;
  [].forEach.call(document.getElementById('tabs').children,function(b){b.classList.toggle('on',b.dataset.tab===name);});
  Object.keys(frames).forEach(function(k){frames[k].style.display=k===name?'block':'none';});
  var tp=document.getElementById('team');tp.style.display=name==='Team'?'block':'none';
  if(name==='Team'){renderTeam();}
  else if(!frames[name]){
    var t=D.tabs.filter(function(x){return x.name===name})[0];if(!t)return;
    var f=document.createElement('iframe');f.className='pane';f.setAttribute('title',name);f.srcdoc=t.html;
    frames[name]=f;document.getElementById('panes').appendChild(f);
  }
  try{localStorage.setItem('onyx_hq_tab',name);}catch(e){}
}

/* ---------- Team panel: same panel as the SOP Library, talking to the SOP Library API ---------- */
function loadTeam(){return fetch(SOP+'?t='+encodeURIComponent(T)+'&json=1',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'could not load team');TEAM=j;return j;});}
function renderTeam(){
  var tp=document.getElementById('team');tp.innerHTML='<div class="sub">Loading team...</div>';
  loadTeam().then(function(){tp.innerHTML=team();wireTeam();}).catch(function(e){tp.innerHTML='<div class="card"><div class="sub" style="color:var(--amber)">'+esc(e.message)+'</div></div>';});
}
function team(){
  var roleOpts=function(sel){return TEAM.roles.map(function(r){return '<option value="'+esc(r.id)+'" '+(sel===r.id?'selected':'')+'>'+esc(r.name)+'</option>'}).join('');};
  var roles=TEAM.roles.map(function(r){return '<div class="card"><div class="row"><span style="font-size:18px">'+esc(r.icon)+'</span><b>'+esc(r.name)+'</b>'+(r.is_admin?'<span class="badge">ADMIN, sees every tab</span>':'')+'<span class="sub">'+(TEAM.members||[]).filter(function(m){return m.role_id===r.id&&m.active}).length+' member(s)</span></div>'
   +'<div class="row"><span class="sub">Sees HQ tabs:</span>'+HQ_TABS.map(function(tn){return '<label class="chk"><input type="checkbox" class="r-hq" data-r="'+esc(r.id)+'" value="'+esc(tn)+'" '+((r.hq_tabs||[]).indexOf(tn)>=0?'checked':'')+(r.is_admin?' disabled':'')+'> '+esc(tn)+'</label>'}).join('')+(r.is_admin?'':'<button class="btn sm primary" data-rsave="'+esc(r.id)+'">Save</button>')+'</div></div>'}).join('');
  var members=(TEAM.members||[]).map(function(m){return '<tr><td><b>'+esc(m.name)+'</b><div class="sub">'+esc(m.email||'')+(m.phone?' · '+esc(m.phone):' · <span style="color:var(--amber)">no phone on file: codes cannot be texted</span>')+'</div></td><td>'+(m.active?'<select class="m-role" data-m="'+m.id+'">'+roleOpts(m.role_id)+'</select>':'<span class="sub">'+esc(m.role_id)+'</span>')+'</td><td class="sub">'+(m.last_seen_at?'seen '+esc(String(m.last_seen_at).slice(0,16).replace('T',' ')):'never opened')+'</td><td>'+(m.active?'<button class="btn sm" data-inv="'+m.id+'">Send invite</button> '+(m.id!==D.member.id?'<button class="btn sm danger" data-deact="'+m.id+'">Deactivate</button>':'<span class="sub">you</span>'):'<button class="btn sm" data-react="'+m.id+'">Reactivate</button>')+'</td></tr>'}).join('');
  return '<div class="card"><h3>Invite someone</h3><div class="form"><div><label>Name</label><input type="text" id="inv-name" placeholder="Full name"></div><div><label>Email (how they sign in)</label><input type="text" id="inv-email" placeholder="name@email.com"></div><div><label>Mobile (the invite and every sign-in code are texted here)</label><input type="text" id="inv-phone" placeholder="+1 555 555 5555" inputmode="tel"></div><div><label>Role</label><select id="inv-role">'+roleOpts('sales_rep')+'</select></div><div><button class="btn primary" id="inv-go">Send invite</button></div><div class="full sub" id="inv-out"></div></div>'
   +'<div class="foot">One link for everyone: <b>'+esc(location.origin+location.pathname)+'</b>. Drop it in Slack. People sign in with the email on this list; the 6-digit code is texted to their phone. They stay signed in for 90 days on that device, and the same sign-in opens the SOP Library. Their role decides which tabs the server sends them: nothing they cannot see ever reaches their browser.</div></div>'
   +'<div class="card"><h3>Members</h3><div style="overflow-x:auto"><table><tr><th>Person</th><th>Role</th><th>Last seen</th><th></th></tr>'+(members||'<tr><td colspan="4" class="sub">Nobody invited yet.</td></tr>')+'</table></div></div>'
   +'<div class="card" style="background:transparent;border:0;padding:0"><h3>Roles: what each one can see</h3>'+roles+'<div class="foot">Change a role\'s tabs and it applies the next time those people open the HQ. To change what SOPs a role can read, use the Team and Roles page in the SOP Library.</div></div>';
}
function wireTeam(){
  var v=document.getElementById('team');
  function all(sel,fn){[].forEach.call(v.querySelectorAll(sel),fn);}
  function sentWhere(j){return (j.sms?'texted to the number ending '+j.phone_hint:'')+(j.sms&&j.email?' and ':'')+(j.email?'emailed':'');}
  all('[data-rsave]',function(b){b.onclick=function(){var id=b.getAttribute('data-rsave');var r=TEAM.roles.filter(function(x){return x.id===id})[0]||{};var hq=[];[].forEach.call(v.querySelectorAll('.r-hq[data-r="'+id+'"]'),function(c){if(c.checked)hq.push(c.value)});
    var role={id:id,name:r.name,department:r.department,visible_departments:r.visible_departments||[],hq_tabs:hq,is_admin:!!r.is_admin,template:!!r.template,color:r.color,icon:r.icon,sort:r.sort,bootcamp_id:r.bootcamp_id};
    sopPost({action:'upsert_role',role:role}).then(function(j){if(!j.ok){toast(j.error);return;}toast('Saved: '+r.name+' sees '+(hq.length?hq.join(', '):'nothing'));renderTeam();});}});
  all('[data-deact]',function(b){b.onclick=function(){if(!confirm('Deactivate this person? They are signed out of the HQ and the SOP Library.'))return;sopPost({action:'deactivate',member_id:b.getAttribute('data-deact')}).then(function(j){if(!j.ok){toast(j.error);return;}renderTeam();});}});
  all('[data-react]',function(b){b.onclick=function(){sopPost({action:'update_member',member_id:b.getAttribute('data-react'),active:true}).then(function(j){if(!j.ok){toast(j.error);return;}toast('Reactivated');renderTeam();});}});
  all('.m-role',function(s){s.onchange=function(){sopPost({action:'update_member',member_id:s.getAttribute('data-m'),role_id:s.value}).then(function(j){if(!j.ok){toast(j.error);return;}toast('Role updated');renderTeam();});}});
  all('[data-inv]',function(b){b.onclick=function(){b.disabled=true;b.textContent='Sending...';sopPost({action:'send_invite',member_id:b.getAttribute('data-inv')}).then(function(j){b.disabled=false;b.textContent='Send invite';toast(j.ok?'Invite '+sentWhere(j):j.error);});}});
  var inv=document.getElementById('inv-go');if(inv)inv.onclick=function(){var name=val('inv-name'),em=val('inv-email'),ph=val('inv-phone');if(!name){toast('Name first');return;}if(!em){toast('Email is needed, it is how they sign in');return;}if(ph.replace(/\D/g,'').length<10){toast('Mobile number is needed, the code is texted to it');return;}inv.disabled=true;document.getElementById('inv-out').textContent='Sending...';sopPost({action:'invite',name:name,email:em,phone:ph,role_id:document.getElementById('inv-role').value}).then(function(j){inv.disabled=false;if(!j.ok){document.getElementById('inv-out').textContent=j.error;return;}document.getElementById('inv-out').textContent=j.sent?('Invite '+sentWhere(j)+'. '+name+' opens this page and signs in with '+em+'.'):('Added, but nothing went out: '+(j.send_error||'unknown')+'. Use Send invite on their row to retry.');renderTeam();});};
}

if(Q.get('e')&&Q.get('c')&&!LEGACY){document.getElementById('load').textContent='Signing you in...';verify(Q.get('e'),String(Q.get('c')).replace(/\D/g,''),null);}
else load();
</script>
</body></html>
