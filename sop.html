<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Onyx SOP Library</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0f14;--card:#131a23;--line:#1f2a37;--tx:#e6edf3;--dim:#8b98a5;--green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff;--pill:#1d2b3a}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
a{color:var(--blue)}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;letter-spacing:.02em;white-space:nowrap}
header .who{color:var(--dim);font-size:13px}
.badge{display:inline-block;background:#3a2f0b;color:#ffd866;border:1px solid #6b5300;border-radius:6px;padding:0 8px;font-size:11px;letter-spacing:.5px;margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;color:var(--dim);border:1px solid transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
nav button.on{background:var(--pill);color:var(--tx);border-color:var(--line)}
main{max-width:1180px;margin:0 auto;padding:18px}
.search{display:flex;gap:10px;margin-bottom:18px}
.search input{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px}
.search input:focus{outline:2px solid var(--blue);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:16px;margin-bottom:4px}
.card .sub,.sub{color:var(--dim);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.btn{background:var(--pill);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--blue);color:#04121f;border-color:var(--blue);font-weight:600}
.btn.danger{color:var(--red);border-color:#5a2020}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tag{display:inline-block;background:var(--pill);color:var(--dim);border-radius:6px;padding:1px 8px;font-size:12px;margin-right:4px}
.tag.tpl{color:var(--amber)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
section h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:10px}
.two{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.rail{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.rail .mod{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin:12px 0 4px}
.rail .l{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.rail .l.on{background:var(--pill)}
.rail .l .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.rail .l.done .dot{background:var(--green);border-color:var(--green)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px;max-width:860px}
.doc h1{font-size:24px;margin-bottom:6px}
.doc h2{font-size:18px;margin:22px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
.doc h3{font-size:15px;margin:16px 0 6px}
.doc p{margin:8px 0;max-width:70ch}
.doc ul,.doc ol{margin:8px 0 8px 22px;max-width:70ch}
.doc li{margin:4px 0}
.doc blockquote{border-left:3px solid var(--blue);padding:4px 12px;color:var(--dim);margin:10px 0}
.doc table{border-collapse:collapse;margin:10px 0;font-size:14px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.doc code{background:var(--pill);padding:1px 5px;border-radius:4px;font-size:13px}
.doc pre{background:var(--pill);padding:12px;border-radius:8px;overflow:auto;font-size:13px}
.doc .meta{color:var(--dim);font-size:13px;margin-bottom:12px}
.video{position:relative;width:100%;max-width:720px;aspect-ratio:16/9;margin:12px 0;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.docbar{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
table.dir{width:100%;border-collapse:collapse;font-size:14px}
table.dir th{color:var(--dim);font-size:11px;text-transform:uppercase;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.dir td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.dir tr:hover td{background:#161d27}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.filters button.on{background:var(--pill);color:var(--tx)}
.ck{display:grid;grid-template-columns:110px 1fr 150px 60px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck:last-child{border-bottom:0}
select,input[type=text],input[type=number],input[type=search],input:not([type]),textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit}
select{background:var(--pill)}
.ck .subj{color:var(--dim);font-size:12px;text-transform:uppercase}
.ck.done .a{color:var(--dim);text-decoration:line-through}
@media(max-width:640px){.ck{grid-template-columns:1fr;gap:4px}}
.pts{font-size:22px;font-weight:700;color:var(--amber)}
.empty{color:var(--dim);padding:30px;text-align:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:860px}
.form input,.form select,.form textarea{width:100%}
.form label{font-size:12px;color:var(--dim);display:block;margin-bottom:3px}
.form .full{grid-column:1/-1}
textarea{min-height:120px;line-height:1.45;resize:vertical}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--bg)}
.sec .head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sec .head input{flex:1;font-weight:600}
.sec textarea{width:100%;background:var(--card)}
.sec .vid{display:flex;gap:8px;align-items:center;margin-top:8px}
.sec .vid input{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row input[type=text]{flex:1;min-width:120px}
.row .n{width:70px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1a2230;color:#e8b44a;padding:8px 14px;border-radius:8px;font-size:13px;z-index:9;display:none}
.result{padding:10px 0;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.result b{cursor:pointer}
.result .path{color:var(--dim);font-size:12px}
mark{background:#4d3a00;color:#ffd866;border-radius:2px}
#load{color:var(--dim);padding:40px;text-align:center}
.foot{color:var(--dim);font-size:12px;margin-top:8px}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:10px;font-size:13px;color:var(--dim)}
.signin{max-width:440px;margin:40px auto;text-align:left}
.signin input{flex:1;font-size:16px;padding:10px 12px}
.signin .code{font-size:22px;letter-spacing:6px;text-align:center;max-width:200px}
</style></head><body>
<header><h1>Social Onyx &middot; SOP Library</h1><span class="who" id="who"></span><nav id="nav"></nav></header>
<main>
<div id="load">Loading your library...</div>
<div id="app" style="display:none">
<div class="search"><input id="q" type="search" placeholder="Ask anything: how do I send the agreement, what is the price floor, what happens after a no-show..." autocomplete="off"></div>
<div id="view"></div>
</div>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
var API='https://rtbatvkghjnuwmgienqv.supabase.co/functions/v1/sop-library';
/* Sign-in (2026-09-13): everyone opens this same page. A personal ?t= link still works (old invites); otherwise the
   session from the email sign-in is kept in localStorage for 90 days. */
var Q=new URLSearchParams(location.search);
var LEGACY=Q.get('t')||'';
function getSession(){try{return localStorage.getItem('sop_session')||''}catch(e){return ''}}
function setSession(s){try{if(s)localStorage.setItem('sop_session',s);else localStorage.removeItem('sop_session');}catch(e){}}
var T=LEGACY||getSession();
var D=null, route={page:'home'}, edit=null, dirFilter='all';
var DEPTS=['company','sales','client','ops','marketing','ceo'];
/* HQ dashboard tabs (2026-09-14). Ticked per role here; the HQ function only ever sends a member the tabs their role allows. */
var HQ_TABS=['Team Board','PnL','Sales Mgmt','Creators & Ads','CSM Daily','Agreements','Commissions'];   // Questions is artifact-only, not a served tab
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},2600);}
function post(body){return fetch(API+'?t='+encodeURIComponent(T),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()});}
function postOpen(body){return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()});}
function signin(msg,email){
  D=null;document.getElementById('app').style.display='none';document.getElementById('who').innerHTML='';document.getElementById('nav').innerHTML='';
  var l=document.getElementById('load');l.style.display='block';
  l.innerHTML='<div class="card signin"><h2>Sign in</h2><div class="sub">Use the email you were invited with. A 6-digit code is texted to the phone on file (an email copy goes out too).</div>'+(msg?'<div class="sub" style="color:var(--amber);margin-top:8px">'+esc(msg)+'</div>':'')+
    '<div class="row" style="margin-top:14px"><input type="text" id="si-email" placeholder="you@company.com" value="'+esc(email||'')+'" autocomplete="email" inputmode="email"><button class="btn primary" id="si-send">Send me a code</button></div>'+
    '<div class="row" id="si-code-row" style="display:none"><input type="text" id="si-code" class="code" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button class="btn primary" id="si-go">Sign in</button></div><div class="sub" id="si-out" style="margin-top:8px"></div></div>';
  var out=document.getElementById('si-out');
  function send(){var em=val('si-email');if(!em){out.textContent='Enter your email.';return;}out.textContent='Sending...';postOpen({action:'login_request',email:em}).then(function(j){if(!j.ok){out.textContent=j.error;return;}document.getElementById('si-code-row').style.display='flex';out.textContent=(j.sms?'Code texted to the number ending '+j.phone_hint+(j.email?' (and emailed to '+em+')':''):'Code emailed to '+em+', check spam the first time')+'. Enter it here.';document.getElementById('si-code').focus();}).catch(function(e){out.textContent='Could not reach the library: '+e;});}
  function go(){var em=val('si-email'),c=val('si-code');if(c.length!==6){out.textContent='Enter the 6-digit code.';return;}out.textContent='Checking...';verify(em,c,out);}
  document.getElementById('si-send').onclick=send;document.getElementById('si-go').onclick=go;
  document.getElementById('si-email').onkeydown=function(e){if(e.key==='Enter')send();};
  document.getElementById('si-code').onkeydown=function(e){if(e.key==='Enter')go();};
  document.getElementById(email?'si-send':'si-email').focus();
}
function verify(em,c,out){
  return postOpen({action:'login_verify',email:em,code:c}).then(function(j){if(!j.ok){if(out)out.textContent=j.error;else signin(j.error,em);return;}setSession(j.session);T=j.session;if(Q.get('c'))history.replaceState({},'',location.pathname);load();}).catch(function(e){if(out)out.textContent='Could not reach the library: '+e;});
}
function load(){
  if(!T){signin();return Promise.resolve();}
  document.getElementById('load').textContent='Loading your library...';document.getElementById('load').style.display='block';
  return fetch(API+'?t='+encodeURIComponent(T)+'&json=1',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){
      if(LEGACY&&T===LEGACY){document.getElementById('load').textContent=j.error==='unknown or inactive link'?'This link is not active. Open the library without a link and sign in with your email, or ask Chris.':('Could not load: '+(j.error||'unknown'));return;}
      setSession('');T='';signin(/expired|inactive|sign in/.test(j.error||'')?'Your sign-in has expired. Enter your email for a new code.':('Could not load: '+(j.error||'unknown')));return;
    }
    D=j; document.getElementById('who').innerHTML=esc(j.member.name)+' \u00b7 '+esc(j.member.role_name)+(j.member.is_ceo?'<span class="badge">CEO</span>':(j.member.is_admin?'<span class="badge">ADMIN</span>':''))+(j.member.via_session?' <button class="btn sm" id="signout" style="margin-left:10px">Sign out</button>':'');
    var so=document.getElementById('signout');if(so)so.onclick=function(){post({action:'logout'}).then(function(){setSession('');T='';signin('Signed out.');});};
    document.getElementById('load').style.display='none';document.getElementById('app').style.display='block';
    nav(); render();
  }).catch(function(e){document.getElementById('load').textContent='Could not reach the library: '+e;});
}
function isAdmin(){return D&&D.member.is_admin;}
function nav(){
  var pages=[['home','Bootcamps'],['dir','SOP Directory']];
  if(isAdmin()){pages.push(['team','Team and Roles']);pages.push(['vault','CEO Vault']);pages.push(['add','Add SOP']);}
  document.getElementById('nav').innerHTML=pages.map(function(p){return '<button data-p="'+p[0]+'" class="'+(route.page===p[0]?'on':'')+'">'+p[1]+'</button>'}).join('');
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.onclick=function(){edit=null;route={page:b.getAttribute('data-p')};document.getElementById('q').value='';nav();render();window.scrollTo(0,0);}});
}
function itemById(id){for(var i=0;i<D.items.length;i++)if(D.items[i].id===id)return D.items[i];return null;}
function bootcampById(id){for(var i=0;i<D.bootcamps.length;i++)if(D.bootcamps[i].id===id)return D.bootcamps[i];return null;}
function render(){
  var v=document.getElementById('view');
  if(route.page==='home')v.innerHTML=home();
  else if(route.page==='bootcamp')v.innerHTML=bootcamp(route.id,route.lesson);
  else if(route.page==='bootcamp-edit')v.innerHTML=bootcampEditor();
  else if(route.page==='dir')v.innerHTML=directory(false);
  else if(route.page==='vault')v.innerHTML=directory(true);
  else if(route.page==='doc')v.innerHTML=doc(route.id);
  else if(route.page==='doc-edit')v.innerHTML=docEditor();
  else if(route.page==='team')v.innerHTML=team();
  else if(route.page==='add')v.innerHTML=addForm();
  else if(route.page==='search')v.innerHTML=search(route.q);
  wire();
}
/* ---------- video embeds ---------- */
function embedUrl(u){
  var m;
  if((m=u.match(/loom\.com\/(?:share|embed)\/([a-zA-Z0-9]+)/)))return 'https://www.loom.com/embed/'+m[1];
  if((m=u.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{6,})/)))return 'https://www.youtube.com/embed/'+m[1];
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return 'https://player.vimeo.com/video/'+m[1];
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)))return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return null;
  return null;
}
function videoHtml(u){
  var e=embedUrl(u);
  if(e)return '<div class="video"><iframe src="'+esc(e)+'" allowfullscreen loading="lazy" allow="fullscreen; picture-in-picture"></iframe></div>';
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return '<div class="video"><video src="'+esc(u)+'" controls style="position:absolute;inset:0;width:100%;height:100%"></video></div>';
  return '<p><a href="'+esc(u)+'" target="_blank" rel="noopener">Watch the video: '+esc(u)+'</a></p>';
}
function renderMd(md){var s=String(md||'').replace(/^@video[ \t]+(\S+)[ \t]*$/gm,function(m,u){return '\n'+videoHtml(u)+'\n';});return window.marked?marked.parse(s):esc(s);}
/* ---------- section model for editing ---------- */
function parseSections(md){
  md=String(md||'').replace(/\r/g,'');
  var parts=md.split(/\n(?=## )/); var intro='';
  if(parts.length&&!/^## /.test(parts[0])){intro=parts.shift();}
  function split(text){var vids=[];var lines=text.split('\n').filter(function(l){var m=l.match(/^@video[ \t]+(\S+)/);if(m){vids.push(m[1]);return false;}return true;});return {text:lines.join('\n').trim(),videos:vids};}
  var i=split(intro);
  var secs=parts.map(function(p){var lines=p.split('\n');var h=lines.shift().replace(/^##\s*/,'');var s=split(lines.join('\n'));return {heading:h,text:s.text,videos:s.videos};});
  return {intro:i.text,introVideos:i.videos,sections:secs};
}
function serializeSections(m){
  var out=(m.intro||'').trim();
  (m.introVideos||[]).forEach(function(v){out+='\n@video '+v;});
  m.sections.forEach(function(s){out+='\n\n## '+(s.heading||'Section').trim()+'\n\n'+(s.text||'').trim();(s.videos||[]).forEach(function(v){out+='\n@video '+v;});});
  return out.trim()+'\n';
}
/* ---------- pages ---------- */
function home(){
  var cards=D.bootcamps.map(function(b){var pct=b.total?Math.round(100*b.finished/b.total):0;
    return '<div class="card"><h2>'+esc(b.name)+(b.template?' <span class="tag tpl">template</span>':'')+'</h2><div class="sub">'+esc(b.description||'')+'</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="sub">'+b.finished+' of '+b.total+' lessons \u00b7 '+pct+'% complete'+(b.checklist.length?' \u00b7 checklist '+b.points+'/'+b.points_total+' pts':'')+'</div>'+
    '<div style="margin-top:12px;display:flex;gap:8px"><button class="btn primary" data-open="'+b.id+'">'+(b.finished?'Continue':'Start')+'</button>'+(isAdmin()?'<button class="btn" data-bedit="'+b.id+'">Edit</button>':'')+'</div></div>';}).join('');
  return '<div class="grid">'+cards+'</div>'+(isAdmin()?'<div style="margin-top:14px"><button class="btn" data-bnew="1">New bootcamp</button></div>':'')+'<div class="foot">Progress saves on its own when you tick a lesson. Use the search box above to find any SOP by what you are trying to do.</div>';
}
function bootcamp(id,lessonId){
  var b=bootcampById(id); if(!b)return '<div class="empty">Not found.</div>';
  var current=null; b.modules.forEach(function(m){m.lessons.forEach(function(l){if(l.id===lessonId)current=l;});});
  if(!current&&!lessonId){for(var i=0;i<b.modules.length&&!current;i++)if(b.modules[i].lessons.length)current=b.modules[i].lessons[0];}
  var rail='<div class="rail card"><div style="font-weight:600">'+esc(b.name)+'</div><div class="sub">'+b.finished+' of '+b.total+' done</div><div class="bar"><i style="width:'+(b.total?Math.round(100*b.finished/b.total):0)+'%"></i></div>';
  b.modules.forEach(function(m){rail+='<div class="mod">'+esc(m.title)+'</div>';m.lessons.forEach(function(l){rail+='<div class="l '+(l.done?'done':'')+' '+(current&&l.id===current.id?'on':'')+'" data-go="'+b.id+'|'+l.id+'"><span class="dot"></span><span>'+esc(l.title)+'</span></div>';});});
  if(b.checklist.length)rail+='<div class="mod">30-day ramp</div><div class="l '+(lessonId==='checklist'?'on':'')+'" data-go="'+b.id+'|checklist"><span class="dot" style="border-color:var(--amber)"></span><span>Checklist \u00b7 '+b.points+'/'+b.points_total+' pts</span></div>';
  rail+='<div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-home="1">All bootcamps</button>'+(isAdmin()?'<button class="btn" data-bedit="'+b.id+'">Edit bootcamp</button>':'')+'</div></div>';
  var body;
  if(lessonId==='checklist')body=checklist(b);
  else if(current){var it=current.item_id?itemById(current.item_id):null;
    body='<div class="doc">'+(it?docBody(it):'<h1>'+esc(current.title)+'</h1><p class="meta">Template lesson. Not written yet.</p><p>This slot is reserved. The person who owns this role writes it (Edit bootcamp, then attach or create an SOP for this lesson).</p>'+(current.link?'<p><a href="'+esc(current.link)+'" target="_blank" rel="noopener">Open the linked resource</a></p>':''))+
      '<div class="docbar"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" class="lesson-done" data-l="'+current.id+'" '+(current.done?'checked':'')+' style="width:18px;height:18px;accent-color:var(--green)"> Mark this lesson done</label>'+nextBtn(b,current)+(isAdmin()&&it?'<button class="btn" data-edit="'+it.id+'" data-ctx="'+b.id+'|'+current.id+'">Edit this SOP</button>':'')+'</div></div>';}
  else body='<div class="empty">No lessons yet.'+(isAdmin()?' Use Edit bootcamp to add some.':'')+'</div>';
  return '<div class="two">'+rail+'<div>'+body+'</div></div>';
}

function search(q){
  var terms=q.toLowerCase().split(/\s+/).filter(function(x){return x.length>1});
  if(!terms.length)return home();
  function score(text){text=(text||'').toLowerCase();var s=0;terms.forEach(function(t){var n=text.split(t).length-1;s+=n;});return s;}
  var hits=[];
  D.items.forEach(function(i){var s=score(i.title)*6+score(i.summary)*3+score(i.body_md);if(s)hits.push({s:s,type:'sop',id:i.id,title:i.title,path:i.department+' \u00b7 '+(i.position||''),snip:snippet(i.body_md||i.summary||'',terms)});});
  D.bootcamps.forEach(function(b){b.modules.forEach(function(m){m.lessons.forEach(function(l){var s=score(l.title)*6;if(s)hits.push({s:s,type:'lesson',b:b.id,id:l.id,title:l.title,path:b.name+' \u00b7 '+m.title,snip:''});});});});
  hits.sort(function(a,b){return b.s-a.s});
  var html=hits.slice(0,25).map(function(h){return '<div class="result"><b '+(h.type==='sop'?'data-doc="'+h.id+'"':'data-go="'+h.b+'|'+h.id+'"')+'>'+esc(h.title)+'</b> <span class="tag">'+(h.type==='sop'?'SOP':'lesson')+'</span><div class="path">'+esc(h.path)+'</div>'+(h.snip?'<div class="sub">'+h.snip+'</div>':'')+'</div>'}).join('');
  return '<section><h3>'+hits.length+' result'+(hits.length===1?'':'s')+' for "'+esc(q)+'"</h3>'+(html||'<div class="empty">Nothing matched. Try different words, or ask Chris and it becomes an SOP.</div>')+'</section>';
}
function snippet(text,terms){var t=String(text).replace(/@video\s+\S+/g,'').replace(/[#*>_`]/g,'');var lower=t.toLowerCase();var pos=-1;for(var i=0;i<terms.length;i++){pos=lower.indexOf(terms[i]);if(pos>=0)break;}if(pos<0)return esc(t.slice(0,160));var start=Math.max(0,pos-70);var s=esc(t.slice(start,start+200));terms.forEach(function(term){s=s.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');});return (start?'...':'')+s+'...';}

  var inv=document.getElementById('inv-go');if(inv)inv.onclick=function(){var name=val('inv-name'),em=val('inv-email'),ph=val('inv-phone');if(!name){toast('Name first');return;}if(!em){toast('Email is needed, it is how they sign in');return;}if(ph.replace(/\D/g,'').length<10){toast('Mobile number is needed, the code is texted to it');return;}inv.disabled=true;document.getElementById('inv-out').textContent='Sending...';post({action:'invite',name:name,email:em,phone:ph,role_id:document.getElementById('inv-role').value}).then(function(j){inv.disabled=false;if(!j.ok){document.getElementById('inv-out').textContent=j.error;return;}document.getElementById('inv-out').textContent=j.sent?('Invite '+sentWhere(j)+'. '+name+' opens the library and signs in with '+em+'.'):('Added, but nothing went out: '+(j.send_error||'unknown')+'. Use Send invite on their row to retry.');load().then(function(){route={page:'team'};render();});});};
