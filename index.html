<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Commissions</title>
<style>/*<![CDATA[*/
:root{--bg:#0b0f14;--card:#131a23;--line:#1f2a37;--tx:#e6edf3;--dim:#8b98a5;--green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:24px 16px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:22px;margin:0}
.asof{color:var(--dim);font-size:13px;margin:4px 0 20px}
.asof b{color:var(--green);font-weight:600}
.strip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 20px;flex:1;min-width:140px}
.kpi .lbl{color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.kpi .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.owed .val{color:var(--green)}
.kpi.wait .val{color:var(--amber)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
section h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
section.alert h2{color:var(--red)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tr.last td{border-bottom:none}
.r{text-align:right}
.dim{color:var(--dim)}
.biz{font-weight:600}
.sub{color:var(--dim);font-size:13px}
.comm{color:var(--green);font-weight:700}
.amber{color:var(--amber);font-weight:700}
tr.done td{opacity:.55}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.owed{background:rgba(210,153,34,.15);color:var(--amber)}
.pill.paid{background:rgba(63,185,80,.15);color:var(--green)}
.pill.rev{background:rgba(139,152,165,.16);color:var(--dim)}
.empty{color:var(--dim);padding:14px;font-size:14px}
.foot{color:var(--dim);font-size:13px;margin-top:6px}
.err{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4);border-radius:10px;padding:14px;color:var(--tx)}
.mp{padding:14px}.mp .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 12px}.mp label{display:block;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.mp input,.mp select,.mp textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}.mp textarea{min-height:48px}
.mp .btn{background:var(--green);color:#04120a;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}.mp .btn:disabled{opacity:.5;cursor:default}.mp .out{color:var(--dim);font-size:13px;margin-top:8px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}.pill.pend{background:#2b2410;color:var(--amber)}.pill.appr{background:#12301c;color:var(--green)}.pill.rej{background:#2a1416;color:var(--red)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
/*]]>*/</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Commissions</h1>
  <div class="asof" id="asof"><span class="spin"></span>Pulling live numbers...</div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>
<script>//<![CDATA[
var API = 'https://rtbatvkghjnuwmgienqv.supabase.co/functions/v1/socialonyx-rep-board';
var q = new URLSearchParams(location.search);
var T = q.get('r') || (location.hash.match(/r=([A-Za-z0-9]+)/) || [])[1] || '';
var lastOk = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
function typeLabel(t) { return t === 'new' ? 'new deal' : t === 'upsell_closer' ? 'upsell on your client' : t === 'upsell_seller' ? 'upsell you sold' : esc(t); }
function td(cls, inner) { return '<td class="' + cls + '">' + inner + '</td>'; }
function table(head, rows) {
  var h = '<tr>' + head.map(function (x) { return '<th class="' + (x.r ? 'r' : '') + '">' + esc(x.t) + '</th>'; }).join('') + '</tr>';
  return '<div class="scroll"><table><thead>' + h + '</thead><tbody>' + rows.join('') + '</tbody></table></div>';
}
function kpi(lbl, val, cls) { return '<div class="kpi ' + (cls || '') + '"><div class="lbl">' + esc(lbl) + '</div><div class="val">' + val + '</div></div>'; }

function render(m) {
  document.title = m.person.split(' ')[0] + "'s Commissions";
  document.getElementById('title').textContent = m.person + ' - Commissions';
  var out = '';
  var D = m.dials || null;
  out += '<div class="strip">' + kpi('Earned', money(m.earned)) + kpi('Paid out', money(m.paid)) + kpi('Owed', money(m.owed), 'owed') + (m.waiting.length ? kpi('Waiting on clients', money(m.waitingTotal), 'wait') : '') + (D ? kpi('Dials today', D.today + ' / ' + D.target, D.today >= D.target ? 'owed' : 'wait') : '') + '</div>';

  if (D) {
    var drows = D.by_day.map(function (d) { return '<tr>' + td('biz', esc(d.day)) + td('r ' + (d.dials >= D.target ? 'comm' : (d.dials ? 'amber' : 'dim')), String(d.dials)) + td('r dim', String(d.connects)) + '</tr>'; });
    out += '<section><h2>Dials, last 7 days (target ' + D.target + ' a day)</h2>' + (drows.length ? table([{ t: 'Day' }, { t: 'Dials', r: 1 }, { t: '30s+ conversations', r: 1 }], drows) : '<div class="empty">No calls logged yet.</div>') + '<div class="empty">' + D.week + ' dials this week across ' + D.days_active + ' active day' + (D.days_active === 1 ? '' : 's') + ' (' + D.per_day + ' per active day), ' + D.connects_week + ' real conversations. Counted from GHL call records, refreshed hourly.</div></section>';
  }

  if (m.failed.length) {
    out += '<section class="alert"><h2>Card declined - call them today</h2>' + table(
      [{ t: 'Customer' }, { t: 'Amount', r: 1 }, { t: 'When' }, { t: 'Reason' }],
      m.failed.map(function (f) { return '<tr>' + td('biz', esc(f.name)) + td('r', money(f.amount)) + td('dim', esc(f.when)) + td('dim', esc(f.reason)) + '</tr>'; })) + '</section>';
  }

  var deals = m.rows.map(function (e) {
    var status = e.paid_at ? '<span class="pill paid">PAID ' + esc(String(e.paid_at).slice(0, 10)) + '</span>' : '<span class="pill owed">OWED</span>';
    return '<tr class="' + (e.paid_at ? 'done' : '') + '">' + td('', '<div class="biz">' + esc(e.business) + '</div><div class="sub">' + esc(e.client) + '</div>') + td('dim', typeLabel(e.entry_type)) + td('r', money(e.collected)) + td('r dim', Number(e.supplier_cost) > 0 ? money(e.supplier_cost) : '-') + td('r dim', Math.round(Number(e.rate) * 100) + '%') + td('r comm', money(e.commission)) + td('r', status) + '</tr>';
  }).concat(m.contested.map(function (e) {
    return '<tr>' + td('', '<div class="biz">' + esc(e.business) + '</div><div class="sub">' + esc(e.client) + '</div>') + td('dim', typeLabel(e.entry_type)) + td('r', money(e.collected)) + td('r dim', '-') + td('r dim', Math.round(Number(e.rate) * 100) + '%') + td('r dim', money(e.commission)) + td('r', '<span class="pill rev">UNDER REVIEW</span>') + '</tr>';
  }));
  out += '<section><h2>Your commissions</h2>' + (deals.length ? table([{ t: 'Deal' }, { t: 'Type' }, { t: 'Collected', r: 1 }, { t: 'Supplier', r: 1 }, { t: 'Rate', r: 1 }, { t: 'Comm', r: 1 }, { t: 'Status', r: 1 }], deals) : '<div class="empty">Nothing credited yet.</div>') + '</section>';

  var wait = m.waiting.map(function (w) { return '<tr>' + td('', '<div class="biz">' + esc(w.biz) + '</div><div class="sub">' + esc(w.client) + '</div>') + td('dim', esc(w.kind || '')) + td('r', money(w.total)) + td('r dim', money(w.got)) + td('r amber', money(w.open)) + td('r comm', money(w.cut || 0)) + td('r dim', w.days + 'd') + '</tr>'; });
  out += '<section><h2>Signed, waiting on money</h2>' + (wait.length ? table([{ t: 'Client' }, { t: 'Type' }, { t: 'Contract', r: 1 }, { t: 'Collected', r: 1 }, { t: 'Still owed', r: 1 }, { t: 'Your cut when paid', r: 1 }, { t: 'Since signing', r: 1 }], wait) : '<div class="empty">Every signed client has paid in full.</div>') + '</section>';

  var uns = m.unsigned.map(function (u) { return '<tr>' + td('biz', esc(u.biz)) + td('dim', esc(u.kind || '')) + td('r', money(u.total)) + td('dim', esc(u.status)) + td('r dim', u.days + 'd') + '</tr>'; });
  out += '<section><h2>Sent, not signed (last 45 days)</h2>' + (uns.length ? table([{ t: 'Client' }, { t: 'Type' }, { t: 'Contract', r: 1 }, { t: 'Status' }, { t: 'Age', r: 1 }], uns) : '<div class="empty">No open agreements.</div>') + '</section>';

  // Manual payments (Chris 2026-09-17): log a payment that did not go through Commas. Pending until Chris, Jose or
  // Romario approves it in the HQ; approved ones count like any other payment (your 10% books within 10 minutes).
  var mrows = (m.manual || []).map(function (p) { var st = p.status === 'approved' ? '<span class="pill appr">APPROVED</span>' : p.status === 'rejected' ? '<span class="pill rej">REJECTED</span>' : '<span class="pill pend">WAITING FOR APPROVAL</span>'; return '<tr>' + td('biz', esc(p.lead_name) + (p.business ? '<div class="sub">' + esc(p.business) + '</div>' : '')) + td('r', money(p.amount)) + td('dim', esc(p.method === 'Custom' ? (p.method_detail || 'custom') : p.method)) + td('dim', esc(p.paid_on)) + td('', st + (p.status === 'rejected' && p.decision_note ? '<div class="sub">' + esc(p.decision_note) + '</div>' : '') + (p.status !== 'pending' && p.decided_by ? '<div class="sub">by ' + esc(p.decided_by) + '</div>' : '')) + '</tr>'; });
  var copts = (m.clients || []).map(function (c) { return '<option value="' + esc(c.client || c.biz || c.email) + '">' + esc((c.biz || '') + (c.email ? ' - ' + c.email : '')) + '</option>'; }).join('');
  var METHODS = ['Zelle', 'Cash', 'Check', 'Wire', 'Venmo', 'CashApp', 'PayPal', 'Commas link paid but not showing', 'Custom'];
  out += '<section><h2>Log a payment that did not go through Commas</h2><div class="mp"><div class="g">'
    + '<div><label>Who paid</label><input id="mp-lead" list="mp-clients" placeholder="Customer name" autocomplete="off"><datalist id="mp-clients">' + copts + '</datalist></div>'
    + '<div><label>Amount</label><input id="mp-amt" inputmode="decimal" placeholder="1000"></div>'
    + '<div><label>How they paid</label><select id="mp-method">' + METHODS.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>'
    + '<div id="mp-custom-wrap" style="display:none"><label>Say how</label><input id="mp-custom" placeholder="e.g. Apple Cash"></div>'
    + '<div><label>Date they paid</label><input id="mp-date" type="date"></div>'
    + '<div><label>Reference or note (optional)</label><input id="mp-note" placeholder="confirmation #, deposit, etc."></div>'
    + '</div><button class="btn" id="mp-go">Log this payment</button><div class="out" id="mp-out">It goes to Chris, Jose and Romario for approval by text. Once approved it counts on the customer\'s balance and your commission.</div></div>'
    + (mrows.length ? table([{ t: 'Customer' }, { t: 'Amount', r: 1 }, { t: 'How' }, { t: 'Paid on' }, { t: 'Status' }], mrows) : '') + '</section>';
  document.getElementById('app').innerHTML = out;
  wireManual(m);
  document.getElementById('foot').textContent = m.rows.length + ' deals credited. Payouts are recorded by Chris.' + (m.lastPayout ? ' Last payout ' + m.lastPayout.paid_on + ' ' + money(m.lastPayout.amount) + '.' : '') + ' New deals pay 10% of cash collected. Upsells pay 5% of cash collected (5% to the rep who sold it and 5% to the rep who originally closed the client). An upsell on your client shows here the moment it is signed. Commission on a partial payment is on what has actually been collected.';
  lastOk = new Date();
  tick();
}

function wireManual(m) {
  var go = document.getElementById('mp-go'); if (!go) return;
  var sel = document.getElementById('mp-method'), cw = document.getElementById('mp-custom-wrap');
  sel.onchange = function () { cw.style.display = sel.value === 'Custom' ? '' : 'none'; };
  var dt = document.getElementById('mp-date'); if (!dt.value) { var n = new Date(); dt.value = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); }
  go.onclick = function () {
    var lead = document.getElementById('mp-lead').value.trim(), out = document.getElementById('mp-out');
    var c = (m.clients || []).filter(function (x) { return (x.client || '').toLowerCase() === lead.toLowerCase() || (x.biz || '').toLowerCase() === lead.toLowerCase(); })[0] || null;
    var body = { action: 'manual_payment', lead_name: lead, business: c ? c.biz : '', email: c ? c.email : '', amount: document.getElementById('mp-amt').value, method: sel.value, method_detail: sel.value === 'Custom' ? document.getElementById('mp-custom').value : document.getElementById('mp-note').value, paid_on: dt.value, note: sel.value === 'Custom' ? document.getElementById('mp-note').value : '' };
    if (!lead) { out.textContent = 'Who paid?'; return; }
    if (!(Number(String(body.amount).replace(/[$,]/g, '')) > 0)) { out.textContent = 'Enter the amount.'; return; }
    if (!confirm('Log ' + money(Number(String(body.amount).replace(/[$,]/g, ''))) + ' ' + (sel.value === 'Custom' ? body.method_detail : sel.value) + ' from ' + lead + ' on ' + dt.value + '? Chris, Jose and Romario get a text to approve it.')) return;
    go.disabled = true; out.textContent = 'Logging...';
    fetch(API + '?r=' + encodeURIComponent(T), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) { go.disabled = false; if (!j.ok) { out.textContent = j.error || 'Could not log it.'; return; } out.textContent = 'Logged (#' + j.id + '). ' + (j.texted && j.texted.length ? 'Texted ' + j.texted.join(', ') + ' to approve it.' : 'Nobody could be texted, tell Chris.'); load(); })
      .catch(function (e) { go.disabled = false; out.textContent = 'Could not log it: ' + e; });
  };
}

function tick() {
  if (!lastOk) return;
  var s = Math.round((Date.now() - lastOk.getTime()) / 1000);
  document.getElementById('asof').innerHTML = '<b>LIVE</b> - updated ' + (s < 5 ? 'just now' : s < 60 ? s + 's ago' : Math.round(s / 60) + ' min ago') + '. Refreshes every minute. A deal shows up the moment the payment lands.';
}

function fail(msg) {
  if (lastOk) { document.getElementById('asof').innerHTML = '<span style="color:var(--amber)">Could not refresh (' + esc(msg) + '). Showing numbers from ' + lastOk.toLocaleTimeString() + '.</span>'; return; }
  document.getElementById('asof').textContent = '';
  document.getElementById('app').innerHTML = '<div class="err">' + esc(msg) + '</div>';
}

function load() {
  if (!T) { fail('This link is missing its access key. Ask Chris for your board link.'); return; }
  fetch(API + '?r=' + encodeURIComponent(T) + '&json=1', { cache: 'no-store' })
    .then(function (r) { if (r.status === 404) throw new Error('This link is not valid. Ask Chris for your board link.'); if (!r.ok) throw new Error('server ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) { fail(e.message || String(e)); });
}
load();
setInterval(load, 60000);
setInterval(tick, 5000);
//]]></script>
</body>
</html>
