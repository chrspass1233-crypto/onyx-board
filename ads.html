<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creators &amp; Ads</title>
<style>
:root{--bg:#0b0f14;--card:#131a23;--line:#1f2a37;--tx:#e6edf3;--dim:#8b98a5;--green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:22px 16px}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:22px;margin:0}
.sub{color:var(--dim);font-size:13px;margin:4px 0 14px}.sub b{color:var(--green);font-weight:600}
.ranges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.ranges button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px}
.ranges button.on{background:var(--blue);border-color:var(--blue);color:#04121f;font-weight:600}
.ranges input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.kpi .s{color:var(--dim);font-size:12px}
.kpi.money .v{color:var(--green)}.kpi.spend .v{color:var(--amber)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
section h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
section h2 span{color:var(--dim);letter-spacing:0;text-transform:none;font-weight:400}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
th.l,td.l{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.l{white-space:normal;min-width:180px}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.name{font-weight:600}.meta{color:var(--dim);font-size:11.5px}
.g{color:var(--green);font-weight:600}.a{color:var(--amber)}.d{color:var(--dim)}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(88,166,255,.15);color:var(--blue);margin-right:6px}
.empty{color:var(--dim);padding:14px}
.err{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4);border-radius:10px;padding:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.foot{color:var(--dim);font-size:12.5px;margin-top:6px}
@media(max-width:640px){.kpi .v{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Creators &amp; Ads</h1>
  <div class="sub" id="asof"><span class="spin"></span>Pulling Meta, GHL and the ledger... 10-20 seconds</div>
  <div class="ranges" id="ranges">
    <button data-r="today" class="on">Today</button><button data-r="yesterday">Yesterday</button><button data-r="7">7D</button><button data-r="30">30D</button>
    <input type="date" id="df"><input type="date" id="dt"><button id="go">Go</button>
  </div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
var API = 'https://rtbatvkghjnuwmgienqv.supabase.co/functions/v1/socialonyx-ads-board';
var q = new URLSearchParams(location.search);
var T = q.get('t') || (location.hash.match(/t=([A-Za-z0-9]+)/) || [])[1] || '';
var cur = null, lastOk = null, timer = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return '$' + (Math.round(Number(n) || 0)).toLocaleString('en-US'); }
function money2(n) { return '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pct(a, b) { return b > 0 ? (100 * a / b).toFixed(1) + '%' : '—'; }
function per(a, b) { return b > 0 ? money2(a / b) : '—'; }
function x(a, b) { return b > 0 ? (a / b).toFixed(2) + 'x' : '—'; }
function iso(d) { return d.toISOString().slice(0, 10); }
function laToday() { var p = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); return p; }
function shift(ymd, n) { var d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
function rng(r) { var t = laToday(); if (r === 'today') return [t, t]; if (r === 'yesterday') { var y = shift(t, -1); return [y, y]; } if (r === '7') return [shift(t, -6), t]; if (r === '30') return [shift(t, -29), t]; return [t, t]; }

function kpi(l, v, s, cls) { return '<div class="kpi ' + (cls || '') + '"><div class="v">' + v + '</div><div class="l">' + esc(l) + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }

function funnelCols(r) {
  return '<td>' + r.leads + '</td><td>' + per(r.spend, r.leads) + '</td>' +
    '<td>' + r.booked + '</td><td class="d">' + pct(r.booked, r.leads) + '</td><td>' + per(r.spend, r.booked) + '</td>' +
    '<td>' + (r.noshow || 0) + '</td>' +
    '<td>' + r.sent + '</td><td class="d">' + pct(r.sent, r.booked) + '</td>' +
    '<td>' + r.signed + '</td><td class="d">' + pct(r.signed, r.sent) + '</td><td>' + per(r.spend, r.signed) + '</td>' +
    '<td class="a">' + money(r.contracted) + '</td>' +
    '<td>' + r.paid + '</td><td class="g">' + money(r.cash) + '</td><td class="g">' + x(r.cash, r.spend) + '</td>';
}
function adCols(r) {
  return '<td class="a">' + money2(r.spend) + '</td><td class="d">' + (r.impressions || 0).toLocaleString() + '</td>' +
    '<td class="d">' + pct(r.link_clicks || r.clicks, r.impressions) + '</td><td class="d">' + per(r.spend, r.link_clicks || r.clicks) + '</td><td class="d">' + pct(r.leads, r.link_clicks || r.clicks) + '</td>' +
    '<td class="d">' + (r.plays ? pct(r.s3, r.impressions) : '—') + '</td><td class="d">' + (r.s3 ? pct(r.thruplay, r.s3) : '—') + '</td><td class="d">' + (r.avg_watch ? r.avg_watch + 's' : '—') + '</td>';
}
var FUNNEL_H = '<th>Leads</th><th>CPL</th><th>Booked</th><th>Lead→booked</th><th>Cost/booking</th><th>No-show</th><th>Sent</th><th>Booked→sent</th><th>Signed</th><th>Sent→signed</th><th>Cost/signed</th><th>Contracted</th><th>Paid</th><th>Cash</th><th>ROAS</th>';
var AD_H = '<th>Spend</th><th>Impr</th><th>CTR</th><th>CPC</th><th>Click→lead</th><th>Hook</th><th>Hold</th><th>Avg watch</th>';

function render(d) {
  cur = d;
  var t = d.totals, all = d.client_total;
  var out = '';
  out += '<div class="grid">' +
    kpi('Leads', all.leads, t.leads + ' from ads · ' + all.organic + ' organic' + (all.imports_excluded ? ' · ' + all.imports_excluded + ' imports excluded' : '')) +
    kpi('Cost per lead', per(t.spend, t.leads), 'paid ads only') +
    kpi('Booked', t.booked, pct(t.booked, t.leads) + ' of ad leads') +
    kpi('Signed', t.signed, pct(t.signed, t.leads) + ' of ad leads · cost ' + per(t.spend, t.signed)) +
    kpi('Revenue contracted', money(t.contracted), 'signed value from these leads', 'money') +
    kpi('Cash collected', money(t.cash), 'ledger, from these leads', 'money') +
    kpi('Ad spend', money2(t.spend), 'ROAS ' + x(t.cash, t.spend) + ' · contracted ' + x(t.contracted, t.spend), 'spend') +
    kpi('Hook / hold', (t.plays ? pct(t.s3, t.impressions) : '—') + ' / ' + (t.s3 ? pct(t.thruplay, t.s3) : '—'), 'avg watch ' + (t.avg_watch ? t.avg_watch + 's' : '—') + ' · CTR ' + pct(t.link_clicks || t.clicks, t.impressions)) +
    '</div>';

  var cr = d.creators.map(function (r) { return '<tr><td class="l"><span class="name">' + esc(r.creator) + '</span></td>' + adCols(r) + funnelCols(r) + '</tr>'; }).join('');
  out += '<section><h2>By creator <span>paid ads, this range</span></h2>' + (d.creators.length ? '<div class="scroll"><table><thead><tr><th class="l">Creator</th>' + AD_H + FUNNEL_H + '</tr></thead><tbody>' + cr + '<tr class="tot"><td class="l">Total</td>' + adCols(t) + funnelCols(t) + '</tr></tbody></table></div>' : '<div class="empty">No paid ads in this range.</div>') + '</section>';

  var ar = d.ads.map(function (r) { return '<tr><td class="l"><span class="tag">' + esc(r.creator) + '</span><span class="name">' + esc(r.ad) + '</span><div class="meta">' + esc(r.campaign || '') + (r.adset ? ' · ' + esc(r.adset) : '') + '</div></td>' + adCols(r) + funnelCols(r) + '</tr>'; }).join('');
  out += '<section><h2>By ad <span>' + d.ads.length + ' ads · sorted by spend</span></h2>' + (d.ads.length ? '<div class="scroll"><table><thead><tr><th class="l">Ad</th>' + AD_H + FUNNEL_H + '</tr></thead><tbody>' + ar + '<tr class="tot"><td class="l">Total</td>' + adCols(t) + funnelCols(t) + '</tr></tbody></table></div>' : '<div class="empty">No ads in this range.</div>') + '</section>';

  var orr = d.organic.map(function (r) { return '<tr><td class="l"><span class="name">' + esc(r.ad) + '</span></td><td>' + r.leads + '</td><td>' + r.booked + '</td><td class="d">' + pct(r.booked, r.leads) + '</td><td>' + (r.noshow || 0) + '</td><td>' + r.sent + '</td><td>' + r.signed + '</td><td class="a">' + money(r.contracted) + '</td><td>' + r.paid + '</td><td class="g">' + money(r.cash) + '</td></tr>'; }).join('');
  out += '<section><h2>Organic &amp; other <span>leads with no ad attached: bio links, referrals, manual adds</span></h2>' + (d.organic.length ? '<div class="scroll"><table><thead><tr><th class="l">Source</th><th>Leads</th><th>Booked</th><th>Lead→booked</th><th>No-show</th><th>Sent</th><th>Signed</th><th>Contracted</th><th>Paid</th><th>Cash</th></tr></thead><tbody>' + orr + '</tbody></table></div>' : '<div class="empty">None in this range.</div>') + '</section>';

  document.getElementById('app').innerHTML = out;
  document.getElementById('foot').textContent = d.definitions.cohort + ' Hook rate = ' + d.definitions.hook + '. Hold rate = ' + d.definitions.hold + '. Cash = ' + d.definitions.cash + '. No-shows only count when a rep marks the appointment as no-show in GHL. Times in Los Angeles (ad account time).';
  lastOk = new Date();
  tick();
}
function tick() {
  if (!lastOk || !cur) return;
  var s = Math.round((Date.now() - lastOk.getTime()) / 1000);
  document.getElementById('asof').innerHTML = '<b>LIVE</b> · ' + esc(cur.range.from) + (cur.range.to !== cur.range.from ? ' to ' + esc(cur.range.to) : '') + ' · updated ' + (s < 5 ? 'just now' : s < 60 ? s + 's ago' : Math.round(s / 60) + ' min ago') + ' · refreshes every 5 minutes';
}
function fail(msg) {
  if (lastOk) { document.getElementById('asof').innerHTML = '<span style="color:var(--amber)">Could not refresh (' + esc(msg) + '). Showing ' + lastOk.toLocaleTimeString() + '.</span>'; return; }
  document.getElementById('asof').textContent = '';
  document.getElementById('app').innerHTML = '<div class="err">' + esc(msg) + '</div>';
}
var range = rng('today');
function load() {
  if (!T) { fail('This link is missing its access key. Ask Chris for the dashboard link.'); return; }
  document.getElementById('asof').innerHTML = '<span class="spin"></span>Pulling Meta, GHL and the ledger for ' + range[0] + (range[1] !== range[0] ? ' to ' + range[1] : '') + '... 10-20 seconds';
  fetch(API + '?t=' + encodeURIComponent(T) + '&from=' + range[0] + '&to=' + range[1], { cache: 'no-store' })
    .then(function (r) { if (r.status === 404) throw new Error('This link is not valid. Ask Chris for the dashboard link.'); if (!r.ok) throw new Error('server ' + r.status); return r.json(); })
    .then(function (d) { if (!d.ok) throw new Error(d.error || 'build failed'); render(d); })
    .catch(function (e) { fail(e.message || String(e)); });
}
var btns = document.querySelectorAll('.ranges button[data-r]');
for (var i = 0; i < btns.length; i++) btns[i].onclick = function () { for (var z = 0; z < btns.length; z++) btns[z].classList.remove('on'); this.classList.add('on'); range = rng(this.getAttribute('data-r')); lastOk = null; load(); };
document.getElementById('go').onclick = function () { var f = document.getElementById('df').value, t = document.getElementById('dt').value; if (!f) return; for (var z = 0; z < btns.length; z++) btns[z].classList.remove('on'); range = [f, t || f]; lastOk = null; load(); };
load();
setInterval(load, 300000);
setInterval(tick, 5000);
</script>
</body>
</html>
